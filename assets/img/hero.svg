<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 420" width="445" height="420" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <!-- Decorative illustration: soft overlapping shapes in the site's sage and sand colours, with a leaf echoing the logo. No text, no photo. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf7"/>
      <stop offset="1" stop-color="#eee3d2"/>
    </linearGradient>
    <linearGradient id="leafg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#698a69"/>
      <stop offset="1" stop-color="#425a42"/>
    </linearGradient>
  </defs>
  <rect width="445" height="420" fill="url(#sky)"/>
  <!-- low sun -->
  <circle cx="318" cy="132" r="64" fill="#faeee9"/>
  <circle cx="318" cy="132" r="40" fill="#e1cdb2" opacity="0.55"/>
  <!-- far hills -->
  <path d="M0 262 C60 214 120 214 190 246 C260 278 330 226 445 236 L445 420 L0 420 Z" fill="#c7d6c7" opacity="0.75"/>
  <!-- mid hills -->
  <path d="M0 318 C70 270 150 282 220 314 C290 346 360 296 445 300 L445 420 L0 420 Z" fill="#a3bca3" opacity="0.8"/>
  <!-- near hill -->
  <path d="M0 370 C90 336 170 350 250 372 C330 394 390 356 445 352 L445 420 L0 420 Z" fill="#698a69" opacity="0.85"/>
  <!-- soft overlapping blobs -->
  <path d="M-30 120 C-10 60 60 40 112 74 C160 106 150 170 98 196 C46 222 -40 190 -30 120 Z" fill="#e3eae3" opacity="0.8"/>
  <path d="M70 60 C100 20 170 18 196 58 C220 96 188 140 142 142 C96 144 44 100 70 60 Z" fill="#f7f2e9" opacity="0.85"/>
  <!-- large leaf with midrib -->
  <g transform="translate(150 118) rotate(18 70 100)">
    <path d="M70 0 C128 44 150 112 108 176 C92 200 78 208 70 214 C62 208 48 200 32 176 C-10 112 12 44 70 0 Z" fill="url(#leafg)"/>
    <path d="M70 18 C72 80 70 150 70 232" fill="none" stroke="#e3eae3" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M70 84 C86 76 98 64 104 52 M70 118 C54 110 42 98 36 86 M70 150 C88 142 100 130 106 118" fill="none" stroke="#e3eae3" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- small drifting leaves -->
  <path d="M356 250 C374 262 380 284 366 300 C352 286 346 266 356 250 Z" fill="#527052" opacity="0.7" transform="rotate(-24 360 275)"/>
  <path d="M60 280 C74 290 78 306 68 318 C56 308 52 292 60 280 Z" fill="#425a42" opacity="0.55" transform="rotate(30 64 300)"/>
  <circle cx="392" cy="84" r="5" fill="#bf9c72" opacity="0.5"/>
  <circle cx="40" cy="196" r="4" fill="#c87a58" opacity="0.4"/>
</svg>
